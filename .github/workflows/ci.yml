name: Run CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  laravel-ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, xml, ctype, iconv, pdo_sqlite
          coverage: none
          tools: composer:v2
          cache: composer

      - name: Copy .env
        run: cp .env.testing .env

      - name: Install Dependencies
        run: composer install --no-interaction --prefer-dist --no-ansi --no-progress --ignore-platform-req=ext-pcntl

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Run Laravel Pint (Code Style Check)
        run: ./vendor/bin/pint --test

      - name: Run PHPStan (Static Analysis)
        run: ./vendor/bin/phpstan analyse --memory-limit=2G

      - name: Run Migrations and Execute Tests
        run: |
          php artisan migrate --seed --env=testing --force
          php artisan test
