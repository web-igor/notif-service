[opcache]
; Кэш опкодов для PHP-FPM и для CLI: Horizon запускается как `php artisan horizon`.
opcache.enable=1
opcache.enable_cli=1

opcache.memory_consumption=256
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000

; Код смонтирован с хоста, поэтому mtime проверяется на каждый запрос
; и правки подхватываются без рестарта php-fpm.
opcache.validate_timestamps=1
opcache.revalidate_freq=0
opcache.file_update_protection=0

; Атрибуты и аннотации Laravel читают комментарии из опкода.
opcache.save_comments=1

; JIT почти не ускоряет обычные HTTP-запросы Laravel и увеличивает расход памяти.
opcache.jit=disable
opcache.jit_buffer_size=0
